[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-core"
version = "0.1.0"
description = "PHANTOM shared Pydantic models, typed exceptions, constants, and structlog configuration."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pydantic v2 for all shared models and validation
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    # Structured logging
    "structlog==24.2.0",
    # Standard library only beyond this line — no service-specific deps
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "jsonschema==4.22.0",  # for schema compatibility tests
]

[tool.hatch.build.targets.wheel]
packages = ["phantom_core"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN001", "ANN002", "ANN003", "ANN202", "B007", "B008", "E402", "F811", "F821", "F841", "SIM102", "SIM105", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

