# PHANTOM Local Development Infrastructure
#
# Usage:
#   docker compose up -d          # Start all infrastructure
#   docker compose down           # Stop and remove containers
#   docker compose down -v        # Stop, remove containers AND volumes (data loss!)
#
# This file defines ONLY local development infrastructure dependencies.
# PHANTOM service containers are NOT defined here; they run outside Docker
# during development (via uvicorn / python -m) for fast iteration.
#
# For full-stack container deployment, see infra/helm/.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — primary durable store for all PHANTOM services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: phantom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-phantom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - phantom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — event streams (transactional outbox), WebSocket fan-out, caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: phantom-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-phantom_dev_password}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - phantom_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-phantom_dev_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection from all PHANTOM services
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: phantom-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - phantom_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # ---------------------------------------------------------------------------
  # Grafana — metrics dashboards and visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: phantom-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - phantom_grafana_data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-phantom_dev_password}"
    depends_on:
      - prometheus

volumes:
  phantom_postgres_data:
    driver: local
  phantom_redis_data:
    driver: local
  phantom_prometheus_data:
    driver: local
  phantom_grafana_data:
    driver: local
