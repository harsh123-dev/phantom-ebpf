[project]
name = "phantom-ebpf-agent"
version = "0.1.0"
description = "PHANTOM privileged eBPF node event collector and behavioral contract agent"
requires-python = ">=3.11"
dependencies = [
    "structlog>=23.1.0",
    "pydantic>=2.5.0",
    "kubernetes>=28.1.0",
    "redis[hiredis]>=5.0.1",
    "aiobotocore>=2.7.0",
    "prometheus-client>=0.19.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.6.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
ignore = ["ANN101", "ANN102", "ANN001", "ANN002", "ANN003", "ANN202", "B007", "B008", "E402", "F811", "F821", "F841", "SIM102", "SIM105", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
