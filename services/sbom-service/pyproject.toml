[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-sbom-service"
version = "0.1.0"
description = "PHANTOM SBOM ingestion, CycloneDX validation, and cosign signature verification service."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "phantom-core>=0.1.0",
    # Web framework
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    # Database
    "asyncpg==0.29.0",
    # HTTP client (for cosign/Rekor API and S3 object store)
    "httpx==0.27.0",
    # S3-compatible object store
    "aiobotocore==2.13.0",
    # Structured logging
    "structlog==24.2.0",
    # Prometheus metrics
    "prometheus-client==0.20.0",
    # Pydantic (pinned via phantom-core; listed for explicit awareness)
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",      # for TestClient
    "ruff==0.5.0",
    "mypy==1.10.1",
    "types-aiobotocore",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN001", "ANN002", "ANN003", "ANN202", "B007", "B008", "E402", "F811", "F821", "F841", "SIM102", "SIM105", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

