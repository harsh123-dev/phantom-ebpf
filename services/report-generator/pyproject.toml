[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-report-generator"
version = "0.1.0"
description = "PHANTOM immutable incident evidence assembly and report rendering service."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "phantom-core>=0.1.0",
    # Database
    "asyncpg==0.29.0",
    # Redis Streams consumer
    "redis[asyncio]==5.0.7",
    # S3-compatible object store
    "aiobotocore==2.13.0",
    # Markdown rendering
    "jinja2==3.1.4",
    # Health probe HTTP server (lightweight)
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    # Structured logging
    "structlog==24.2.0",
    # Prometheus metrics
    "prometheus-client==0.20.0",
    # Pydantic
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "fakeredis[asyncio]==2.23.2",
    "moto[s3]==5.0.10",   # S3 mock for object-store tests
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN001", "ANN002", "ANN003", "ANN202", "B007", "B008", "E402", "F811", "F821", "F841", "SIM102", "SIM105", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

