---
# PHANTOM Evaluation Target Workloads
# Deploy these into the phantom-eval namespace.
# These are the victim services the attack scenarios inject into.
apiVersion: v1
kind: Namespace
metadata:
  name: phantom-eval
---
# recommendationservice — Python service targeted by XZ-Utils attack + benign scenarios
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: phantom-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      containers:
        - name: server
          # Real Google Online Boutique recommendationservice (Python).
          # Moved from gcr.io to Google Artifact Registry in 2024.
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: DISABLE_PROFILER
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: phantom-eval
spec:
  selector:
    app: recommendationservice
  ports:
    - port: 8080
      targetPort: 8080
---
# emailservice — Python service targeted by dependency-confusion + SolarWinds attacks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: phantom-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
        - name: server
          # Real Google Online Boutique emailservice (Python).
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice:v0.10.1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DISABLE_PROFILER
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: phantom-eval
spec:
  selector:
    app: emailservice
  ports:
    - port: 8080
      targetPort: 8080
---
# cartservice — Go service targeted by benign-restart scenario
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: phantom-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      containers:
        - name: server
          # Real Google Online Boutique cartservice (Go/dotnet).
          # SolarWinds attack deploys a backdoored version of this exact image.
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/cartservice:v0.10.1
          ports:
            - containerPort: 7070
          env:
            - name: REDIS_ADDR
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: phantom-eval
spec:
  selector:
    app: cartservice
  ports:
    - port: 7070
      targetPort: 7070
---
# phantom-sink — Accepts inbound beacon connections from attack payloads
# (simple netcat/socat listener so the beacon TCP connect succeeds)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-sink
  namespace: phantom-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phantom-sink
  template:
    metadata:
      labels:
        app: phantom-sink
    spec:
      containers:
        - name: sink
          image: python:3.11-slim
          command:
            - python3
            - -c
            - |
              import socket, threading
              def handle(c):
                  try: c.recv(1024)
                  finally: c.close()
              for port in [8443, 4446, 8080]:
                  s = socket.socket()
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind(('0.0.0.0', port))
                  s.listen(50)
                  threading.Thread(target=lambda srv=s: [handle(srv.accept()[0]) for _ in iter(int, 1)], daemon=True).start()
              print("phantom-sink listening on 8443, 4446, 8080")
              import time
              while True: time.sleep(60)
          ports:
            - containerPort: 8443
            - containerPort: 4446
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: phantom-sink
  namespace: phantom-eval
spec:
  selector:
    app: phantom-sink
  ports:
    - name: https-beacon
      port: 8443
      targetPort: 8443
    - name: http-beacon
      port: 4446
      targetPort: 4446
    - name: http
      port: 8080
      targetPort: 8080
