---
# PHANTOM Evaluation Target Workloads
# Deploy these into the phantom-eval namespace.
# These are the victim services the attack scenarios inject into.
apiVersion: v1
kind: Namespace
metadata:
  name: phantom-eval
---
# recommendationservice — Python service targeted by XZ-Utils attack + benign scenarios
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  namespace: phantom-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      containers:
        - name: server
          # python:3.11-slim is REQUIRED for the evaluation scripts.
          # The real Google v0.10.1 images are "distroless" and have no pip or tar!
          # Because the synthetic attacks inject via kubectl cp and pip install,
          # they require a standard container base image.
          image: tiangolo/uwsgi-nginx-flask:python3.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: PIP_BREAK_SYSTEM_PACKAGES
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  namespace: phantom-eval
spec:
  selector:
    app: recommendationservice
  ports:
    - port: 8080
      targetPort: 80
---
