# research/evaluation/pyproject.toml
#
# Minimal project metadata for the PHANTOM evaluation framework.
# Allows `pip install -e .` and pytest discovery without installing
# any individual service package.

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "phantom-evaluation"
version = "0.1.0"
description = "PHANTOM reproducible evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0.2",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
# Allow discovery of `research.evaluation.*` from repo root when installed with
#   pip install -e . (from repo root)
where = ["..", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Markers used in the test suite.
markers = [
    "unit: pure unit tests (no I/O, no kubectl, no API)",
    "integration: tests that require a running PHANTOM cluster",
]
filterwarnings = ["error::DeprecationWarning"]
