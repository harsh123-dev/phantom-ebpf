# Secrets (passwords, tokens, keys) are in Kubernetes Secrets,
# never in this ConfigMap.
# Replace REPLACE_WITH_* values with Terraform outputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: phantom-config
  namespace: phantom
data:
  gateway_url: "http://phantom-api-gateway:8080"
  sbom_service_url: "http://phantom-sbom-service:8080"
  causal_engine_url: "http://phantom-causal-engine:8080"
  report_generator_url: "http://phantom-report-generator:8080"
  redis_host: "REPLACE_WITH_ELASTICACHE_ENDPOINT"
  postgres_host: "REPLACE_WITH_RDS_ENDPOINT"
  postgres_db: "phantom"
  postgres_port: "5432"
  redis_port: "6379"
  log_level: "INFO"
  metrics_port: "9090"
  health_port: "8080"
  report_store_backend: "s3"
