apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: phantom-ebpf-agent
  namespace: phantom
spec:
  selector:
    matchLabels:
      app: phantom-ebpf-agent
  template:
    metadata:
      labels:
        app: phantom-ebpf-agent
    spec:
      serviceAccountName: phantom-node-agent
      hostPID: true
      # hostNetwork is intentionally false to prevent host port 8080 collision with API Gateway.
      # eBPF kernel tracing and cgroup tracking operate via hostPID, privileged mode, and host mounts.
      tolerations:
        - operator: Exists
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
      containers:
        # Container named 'phantom-agent' to match Prometheus PromQL cAdvisor queries
        - name: phantom-agent
          image: phantom/ebpf-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PHANTOM_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: phantom-config
                  key: gateway_url
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: phantom-config
                  key: gateway_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: phantom-agent-secret
                  key: redis_url
            - name: PHANTOM_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: phantom-agent-secret
                  key: token
            - name: WATCH_NAMESPACES
              value: "phantom-eval"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
