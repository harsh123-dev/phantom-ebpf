apiVersion: v1
kind: ConfigMap
metadata:
  name: phantom-config
  namespace: phantom
data:
  gateway_url: "http://phantom-api-gateway.phantom.svc.cluster.local:8080"
  sbom_service_url: "http://phantom-sbom-service.phantom.svc.cluster.local:8080"
  causal_engine_url: "http://phantom-causal-engine.phantom.svc.cluster.local:8080"
  report_generator_url: "http://phantom-report-generator.phantom.svc.cluster.local:8082"
  log_level: "INFO"
  health_port: "8080"
  cluster_identity: "phantom-k3s-lab"
  report_store_backend: "memory"
  sbom_s3_bucket: "phantom-k3s-lab-253490771520-ap-south-1-evidence"
  sbom_s3_region: "ap-south-1"
  sbom_s3_key_prefix: "phantom/evidence/sboms"
  sbom_allowed_artifact_prefix: "phantom/evidence/"
