apiVersion: v1
kind: ConfigMap
metadata:
  name: phantom-config
  namespace: phantom
data:
  gateway_url: "http://phantom-api-gateway.phantom.svc.cluster.local:8080"
  sbom_service_url: "http://phantom-sbom-service.phantom.svc.cluster.local:8080"
  causal_engine_url: "http://phantom-causal-engine.phantom.svc.cluster.local:8080"
  report_generator_url: "http://phantom-report-generator.phantom.svc.cluster.local:8082"
  log_level: "INFO"
  health_port: "8080"
  report_store_backend: "memory"
---
apiVersion: v1
kind: Secret
metadata:
  name: phantom-api-gateway-secret
  namespace: phantom
type: Opaque
stringData:
  database_url: "postgresql://phantom:phantom_dev_password@phantom-postgres.phantom.svc.cluster.local:5432/phantom"
  redis_url: "redis://phantom-redis.phantom.svc.cluster.local:6379/0"
  jwt_issuer: "https://phantom-lab.local"
  jwt_audience: "phantom-evaluation"
  jwks_uri: "http://phantom-api-gateway.phantom.svc.cluster.local:8080/.well-known/jwks.json"
---
apiVersion: v1
kind: Secret
metadata:
  name: phantom-causal-engine-secret
  namespace: phantom
type: Opaque
stringData:
  database_url: "postgresql://phantom:phantom_dev_password@phantom-postgres.phantom.svc.cluster.local:5432/phantom"
  redis_url: "redis://phantom-redis.phantom.svc.cluster.local:6379/1"
---
apiVersion: v1
kind: Secret
metadata:
  name: phantom-sbom-service-secret
  namespace: phantom
type: Opaque
stringData:
  database_url: "postgresql://phantom:phantom_dev_password@phantom-postgres.phantom.svc.cluster.local:5432/phantom"
  s3_bucket: "phantom-lab-local"
  s3_access_key_id: "lab-local"
  s3_secret_access_key: "lab-local"
  s3_region: "ap-south-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: phantom-agent-secret
  namespace: phantom
type: Opaque
stringData:
  redis_url: "redis://phantom-redis.phantom.svc.cluster.local:6379/0"
  token: "lab-agent-token-12345"
