metadata:
  name: phantom-api-gateway-secret
  namespace: phantom
type: Opaque
stringData:
  database_url: "postgresql://phantom:phantom_dev_password@phantom-postgres.phantom.svc.cluster.local:5432/phantom"
  redis_url: "redis://phantom-redis.phantom.svc.cluster.local:6379/0"
  jwt_issuer: "https://phantom-lab.local"
  jwt_audience: "phantom-evaluation"
  jwks_uri: "http://phantom-api-gateway.phantom.svc.cluster.local:8080/.well-known/jwks.json"
---
apiVersion: v1
