# ---------------------------------------------------------------------------
# In-Cluster Lightweight PostgreSQL (Replaces AWS RDS)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-postgres
  namespace: phantom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phantom-postgres
  template:
    metadata:
      labels:
        app: phantom-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: "phantom"
            - name: POSTGRES_USER
              value: "phantom"
            - name: POSTGRES_PASSWORD
              value: "phantom_dev_password"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "phantom", "-d", "phantom"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: phantom-postgres
  namespace: phantom
spec:
  type: ClusterIP
  selector:
    app: phantom-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
# ---------------------------------------------------------------------------
# In-Cluster Lightweight Redis (Replaces AWS ElastiCache)
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phantom-redis
  namespace: phantom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phantom-redis
  template:
    metadata:
      labels:
        app: phantom-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "no", "--save", ""]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: phantom-redis
  namespace: phantom
spec:
  type: ClusterIP
  selector:
    app: phantom-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
