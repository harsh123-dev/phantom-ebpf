spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sbom-service
          env:
            - name: AWS_PROFILE
              value: phantom-sbom
            - name: AWS_CONFIG_FILE
              value: /etc/aws/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /dev/null
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: PHANTOM_AWS_CREDENTIAL_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: phantom-sbom-aws-client
                  key: broker_url
            - name: PHANTOM_AWS_CREDENTIAL_TOKEN_FILE
              value: /var/run/secrets/phantom-aws-identity/token
            - name: PHANTOM_AWS_CREDENTIAL_CA_FILE
              value: /var/run/secrets/phantom-aws-identity-ca/ca.crt
          volumeMounts:
            - name: aws-sdk-config
              mountPath: /etc/aws
              readOnly: true
            - name: aws-workload-token
              mountPath: /var/run/secrets/phantom-aws-identity
              readOnly: true
            - name: aws-broker-ca
              mountPath: /var/run/secrets/phantom-aws-identity-ca
              readOnly: true
      volumes:
        - name: aws-sdk-config
          configMap:
            name: phantom-sbom-aws-client
            items:
              - key: config
                path: config
        - name: aws-workload-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: phantom-aws-credential-broker
                  expirationSeconds: 600
                  path: token
        - name: aws-broker-ca
          configMap:
            name: phantom-aws-credential-broker-ca
            items:
              - key: ca.crt
                path: ca.crt
