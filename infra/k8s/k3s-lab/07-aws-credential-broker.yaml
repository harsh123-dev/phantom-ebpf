apiVersion: v1
kind: Namespace
metadata:
  name: phantom-identity
  labels:
    app.kubernetes.io/part-of: phantom
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: phantom-aws-credential-broker
  namespace: phantom-identity
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: phantom-aws-credential-broker-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: phantom-aws-credential-broker-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: phantom-aws-credential-broker-tokenreview
subjects:
  - kind: ServiceAccount
    name: phantom-aws-credential-broker
    namespace: phantom-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: phantom-aws-credential-broker-verify-sbom-pod
  namespace: phantom
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: phantom-aws-credential-broker-verify-sbom-pod
  namespace: phantom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: phantom-aws-credential-broker-verify-sbom-pod
subjects:
  - kind: ServiceAccount
    name: phantom-aws-credential-broker
    namespace: phantom-identity
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: phantom-aws-credential-broker
  namespace: phantom-identity
  labels:
    app: phantom-aws-credential-broker
spec:
  selector:
    matchLabels:
      app: phantom-aws-credential-broker
  template:
    metadata:
      labels:
        app: phantom-aws-credential-broker
    spec:
      serviceAccountName: phantom-aws-credential-broker
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: true
      containers:
        - name: broker
          image: phantom/aws-credential-broker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 18443
              hostPort: 18443
              protocol: TCP
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: phantom-aws-workload-config
                  key: region
            - name: PHANTOM_S3_WORKLOAD_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: phantom-aws-workload-config
                  key: role_arn
            - name: PHANTOM_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: phantom-aws-workload-config
                  key: bucket
            - name: PHANTOM_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: phantom-aws-workload-config
                  key: prefix
            - name: PHANTOM_BROKER_TLS_CERT_FILE
              value: /var/run/phantom-broker/tls.crt
            - name: PHANTOM_BROKER_TLS_KEY_FILE
              value: /var/run/phantom-broker/tls.key
          volumeMounts:
            - name: broker-tls
              mountPath: /var/run/phantom-broker
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: broker-tls
          secret:
            secretName: phantom-aws-credential-broker-tls
            defaultMode: 0440
