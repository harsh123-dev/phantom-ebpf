apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-report-generator
  namespace: phantom
spec:
  podSelector:
    matchLabels:
      app: phantom-report-generator
  policyTypes:
    - Ingress
    - Egress
  ingress:
