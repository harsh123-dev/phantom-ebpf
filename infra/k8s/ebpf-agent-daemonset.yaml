apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: phantom-ebpf-agent
  namespace: phantom
spec:
  selector:
    matchLabels:
      app: phantom-ebpf-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: phantom-ebpf-agent
    spec:
      serviceAccountName: phantom-node-agent
      hostPID: true
      # Required for: reading /proc/<pid>/cgroup for identity mapping.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
          # Tolerate all taints so the agent runs on every node, including
          # control-plane nodes when PHANTOM must monitor them.
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
            # Required for: cgroup ID to container ID mapping.
        - name: proc
          hostPath:
            path: /proc
            type: Directory
            # Required for: reading process namespaces.
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
            # Required for: eBPF BTF and tracing infrastructure.
      containers:
        - name: ebpf-agent
          image: 596717729313.dkr.ecr.ap-south-1.amazonaws.com/phantom/ebpf-agent:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          securityContext:
            privileged: true
            # Required for: eBPF program loading and kernel attachment.
            # CAP_BPF and CAP_SYS_ADMIN are the minimum for eBPF.
            # privileged: true is used for simplicity in the research prototype.
            # Production note: restrict to CAP_BPF + CAP_PERFMON when kernel
            # >= 5.8 capabilities are fully supported.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              # Note: eBPF maps consume kernel memory outside these limits.
              # Monitor kernel memory separately.
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PHANTOM_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: phantom-config
                  key: gateway_url
            - name: PHANTOM_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: phantom-agent-secret
                  key: token
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
