name: eBPF Agent

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile-and-test:
    name: Compile CO-RE objects and run ABI tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel_version:
          - "5.15"
          - "6.1"
          - "6.8"
    steps:
      - uses: actions/checkout@v4

      - name: Install libbpf and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang llvm libelf-dev libbpf-dev linux-headers-generic

      - name: Compile eBPF programs (CO-RE)
        run: |
          make -C services/ebpf-agent bpf
        # VERIFY: kernel-header matrix must be validated for each listed kernel_version

      - name: Run ABI tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute ABI test suite
        run: pytest services/ebpf-agent/tests/ -v --tb=short
