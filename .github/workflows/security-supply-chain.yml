name: Supply Chain Security

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  sbom-scan-sign:
    name: Generate source-tree SBOMs and scan dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOMs for Python services
        run: |
          for service in sbom-service causal-engine api-gateway report-generator; do
            syft dir:services/$service -o cyclonedx-json > services/$service/sbom.cyclonedx.json
          done

      - name: Scan dependencies (Grype)
        uses: anchore/scan-action@v4
        with:
          path: "."
          fail-build: false

      - name: Upload source-tree SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: phantom-source-tree-sboms-${{ github.sha }}
          path: services/**/sbom.cyclonedx.json
          if-no-files-found: error
